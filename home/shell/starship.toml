# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# A minimal left prompt
format = """$sudo$directory$status$character"""

# move the rest of the prompt to the right
right_format = """$aws${env_var.CTX_CURRENT}$all"""

[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
symbol = " "

[buf]
symbol = " "

[c]
symbol = " "

[character]
success_symbol = '[➜](bold blue) '
error_symbol = '[➜](bold red) '

[cmd_duration]
disabled = false
format = '⌛ [$duration]($style) '
min_time = 1
show_notifications = true

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 🔒"
home_symbol = "🏠"
truncate_to_repo = false

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[env_var.CTX_CURRENT]
format = '([$symbol$env_value]($style) )'
symbol = '󰒓 '
style = 'bold green'

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "

[git_commit]
tag_symbol = '  '

[git_status]
conflicted = "="
ahead =	"⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = " ✓ "
untracked = "?${count}"
stashed = ""
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = " ${count}"

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

# Let's see later if I want to enable this (currently too verbose for single line prompt)
[kubernetes]
disabled = true

[line_break]
disabled = true

[lua]
symbol = " "

[memory_usage]
disabled = false
symbol = " "

[meson]
symbol = "󰔷 "

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "

[nodejs]
